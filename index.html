<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sai Baba - Cinematic Particle Drawing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stage-container">
        <div class="reel-frame" id="reel-frame">
            <!-- Final Original Image Layer -->
            <div class="image-container" id="image-container">
                <img id="final-image" src="sai-baba.jpeg" alt="Sai Baba" />
            </div>

            <!-- Advanced Particle Drawing Canvas -->
            <canvas id="particle-canvas"></canvas>

            <!-- Minimalist Replay Action -->
            <button id="replay-btn" class="replay-button" aria-label="Replay Animation">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
